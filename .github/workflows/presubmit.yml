name: Presubmit Checks

on:
  pull_request:
    branches: [ main ]

  # A release is tag-driven: the whole matrix below runs against the tag, and only
  # if it passes does the release job publish the assets.
  push:
    tags:
      - 'v*'

  schedule:
    - cron: '0 2 * * 0'  # Weekly

jobs:
  # The checked-in cobs.h must stay unversioned; a release stamps the tag into it.
  # release.py is standard library only, so the runner's own python3 is enough.
  version-placeholder:
    name: version placeholder intact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Placeholder intact
        run: python3 release.py --check

  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    permissions:
      packages: read

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        sanitizer: [ "memory", "address", "safe-stack", "undefined" ]

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: CC=clang CXX=clang++ COBS_SANITIZER=${{ matrix.sanitizer }} make -j

  arm-cm4:
    runs-on: ubuntu-latest

    permissions:
      packages: read

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - name: Cache the envy toolchain
        uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ hashFiles('envy.lua', 'envy/*.lua') }}
      - name: Build (default and byte-loop configurations)
        run: make arm
      - name: Code size
        run: make size
      - name: Size budget
        run: make size-check
      - name: No standard library calls
        run: make size-nolibc

  linux:
    name: linux (${{ matrix.compiler.name }}, ${{ matrix.architecture }})
    runs-on: ubuntu-latest

    permissions:
      packages: read

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        compiler:
          - { name: "clang", env: "CC=clang CXX=clang++" }
          - { name: "gcc", env: "CC=gcc CXX=g++" }
        architecture: [32, 64]

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: ${{ matrix.compiler.env }} COBS_LINUXARCH=${{ matrix.architecture }} make -j

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make -j

  win:
    name: windows (msvc, ${{ matrix.architecture }})
    runs-on: windows-latest

    strategy:
      matrix:
        architecture: [32, 64]

    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Could not locate a Visual Studio installation via vswhere 1>&2
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars${{ matrix.architecture }}.bat" || exit /b 1
          call make-win.bat

  swar-configs:
    name: swar (${{ matrix.word_bits }}-bit words)
    runs-on: ubuntu-latest

    permissions:
      packages: read

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        word_bits: [8, 16, 32, 64]

    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: COBS_SWAR_WORD_BITS=${{ matrix.word_bits }} make -j

  exhaustive:
    name: exhaustive tests (asan)
    runs-on: ubuntu-latest

    permissions:
      packages: read

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - name: Build and run the slow test tier
        run: CC=clang CXX=clang++ COBS_SANITIZER=address make test-all -j

  qemu:
    name: qemu (${{ matrix.probe.name }})
    runs-on: ubuntu-latest

    permissions:
      packages: read

    container:
      image: ghcr.io/charlesnicholson/docker-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        probe:
          - { name: "cortex-m3, 32-bit", args: "--target cm3" }
          - { name: "avr, 16-bit words", args: "--target avr --word-bits 16" }
          - { name: "avr, byte loop", args: "--target avr" }
          - { name: "fault injection", args: "--target cm3 --expect-fail" }

    steps:
      - uses: actions/checkout@v7
      - name: Cache the envy toolchain
        uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ hashFiles('envy.lua', 'envy/*.lua') }}
      # qemu stays an apt package: its Debian dependency closure is 27 shared
      # libraries, so bundling it through envy would be re-implementing apt.
      - name: qemu
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends qemu-system-arm qemu-system-misc
      - name: Toolchains
        run: ./bin/envy sync
      - name: Differential probe
        run: ./bin/python3 tests/qemu/run.py ${{ matrix.probe.args }}

  # Nothing generated is checked in, so this builds the wasm from cobs.c every run.
  # build_wasm.py asserts on the result before the tests import it.
  js:
    name: js (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Cache the envy toolchain
        uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ hashFiles('envy.lua', 'envy/*.lua') }}
      - name: Toolchains
        run: ./bin/envy sync
      - name: Test
        run: make js-test
      # Catches a packaging mistake on the PR rather than on tag day.
      - name: Pack
        run: make js-pack

  all-checks-pass:
    needs: [version-placeholder, sanitizers, linux, macos, win, arm-cm4, swar-configs,
            exhaustive, qemu, js]
    runs-on: ubuntu-latest
    steps:
    - run: echo Done

  release:
    needs: [all-checks-pass]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read  # release.py reads the titles of the pull requests it links
      packages: write      # GitHub Packages npm registry
      id-token: write      # OIDC, for npm provenance

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # release.py walks back to the previous tag for the notes

      - uses: actions/setup-node@v4
        with:
          node-version: '24'  # ships an npm new enough for trusted publishing

      - name: Cache the envy toolchain
        uses: actions/cache@v6
        with:
          path: build/envy-cache
          key: envy-${{ runner.os }}-${{ hashFiles('envy.lua', 'envy/*.lua') }}

      # The wasm is a build artifact, so the package is compiled from cobs.c here.
      - name: Toolchains
        run: ./bin/envy sync

      # Stamps the tag into cobs.h, zips it up with cobs.c, and composes the notes.
      # Run it locally to see exactly what a tag would ship.
      - name: Prepare the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 release.py --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --out build/release

      # Test before publishing, so the tarball comes from the tree the tests ran on.
      - name: Build and test the npm package
        run: make js-test

      # Stamps build/js only; the source manifest keeps its 0.0.0 placeholder.
      # stdout is the dist-tag, so a prerelease cannot land on `latest`.
      - name: Stamp the package version
        id: npm
        run: echo "dist_tag=$(python3 release.py --stamp-npm build/js --tag "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"

      # Not `make js-pack`: it depends on js-package, which would re-copy the
      # unstamped manifest. Nothing may re-assemble build/js past this point.
      - name: Pack the tarball for the release asset
        working-directory: build/js
        run: npm pack --pack-destination ..

      # Before the registry publishes: the source zip must not be hostage to npm.
      # Idempotent so a re-run after a failed publish still completes.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file build/release/release_notes.txt \
              "build/release/nanocobs-${GITHUB_REF_NAME}.zip" \
              build/nanocobs-*.tgz
          fi

      # Authenticated by OIDC through npm's trusted publisher for this repo, so there
      # is no token. Skipped if the version is already up, so a re-run is safe.
      - name: Publish to npm
        working-directory: build/js
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "nanocobs@$v" version >/dev/null 2>&1; then
            echo "nanocobs@$v already published"
          else
            npm publish --provenance --access public --tag "${{ steps.npm.outputs.dist_tag }}"
          fi

      # setup-node only authed registry.npmjs.org, so this host needs its own entry.
      # npm never packs .npmrc, and the tarball was built above regardless.
      - name: Publish to GitHub Packages
        working-directory: build/js
        env:
          GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ../../release.py --stamp-npm . --tag "${GITHUB_REF_NAME}" \
            --npm-name "@${GITHUB_REPOSITORY_OWNER}/nanocobs" >/dev/null
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_PKG_TOKEN" > .npmrc
          v=$(node -p 'require("./package.json").version')
          n=$(node -p 'require("./package.json").name')
          if npm view --registry=https://npm.pkg.github.com "$n@$v" version >/dev/null 2>&1; then
            echo "$n@$v already published"
          else
            npm publish --registry=https://npm.pkg.github.com \
              --tag "${{ steps.npm.outputs.dist_tag }}"
          fi
